<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Publishing history — CommitCraft</title>
    <meta name="commitcraft-api" content="http://localhost:8787" />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <script>
      (function () {
        try {
          var preference = localStorage.getItem('cc.theme') || 'system';
          var light = preference === 'light' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.dataset.theme = light ? 'light' : 'dark';
          document.documentElement.style.colorScheme = light ? 'light' : 'dark';
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
      <div class="app-main">
        <header class="topbar" id="topbar"></header>
        <main class="page" id="main">
          <div class="page__head">
            <div>
              <div class="page__eyebrow">Activity</div>
              <h1 class="page__title">Publishing history</h1>
              <p class="page__desc">
                Each record lists the commits CommitCraft actually created, with links back to GitHub.
              </p>
            </div>
            <div class="page__actions">
              <button class="btn btn--secondary" type="button" id="refreshHistory">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
                Refresh
              </button>
              <a class="btn btn--primary" href="upload.html">New publish</a>
            </div>
          </div>

          <section class="grid grid--stats" id="historyStats" aria-label="History totals">
            <div class="skeleton skeleton--card"></div>
            <div class="skeleton skeleton--card"></div>
            <div class="skeleton skeleton--card"></div>
            <div class="skeleton skeleton--card"></div>
          </section>

          <section class="card" aria-labelledby="historyTitle">
            <div class="card__head">
              <div>
                <h2 class="card__title" id="historyTitle">Jobs</h2>
                <p class="card__desc" id="historyCount">Loading…</p>
              </div>
              <div class="card__actions">
                <div class="segmented" role="group" aria-label="Filter by status">
                  <button class="segmented__btn" type="button" data-status="all" aria-pressed="true">All</button>
                  <button class="segmented__btn" type="button" data-status="completed" aria-pressed="false">Completed</button>
                  <button class="segmented__btn" type="button" data-status="partial" aria-pressed="false">Partial</button>
                  <button class="segmented__btn" type="button" data-status="failed" aria-pressed="false">Failed</button>
                  <button class="segmented__btn" type="button" data-status="cancelled" aria-pressed="false">Cancelled</button>
                </div>
              </div>
            </div>
            <div class="card__body card__body--flush">
              <div style="padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border)">
                <div class="input-group" style="max-width:340px">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                  <input class="input" id="historySearch" type="search" placeholder="Search repositories" aria-label="Search history" autocomplete="off" />
                </div>
              </div>
              <div id="historyBody">
                <div style="padding:var(--space-4)">
                  <div class="skeleton skeleton--line" style="width:70%;margin-bottom:12px"></div>
                  <div class="skeleton skeleton--line" style="width:50%"></div>
                </div>
              </div>
            </div>
          </section>
        </main>
        <footer class="app-footer">
          <span>CommitCraft · Every file. A meaningful commit.</span>
          <span class="app-footer__links">
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
            <span>Developed by PythosX</span>
          </span>
        </footer>
      </div>
    </div>
    <script type="module" src="js/pages/history.js"></script>
  </body>
</html>
